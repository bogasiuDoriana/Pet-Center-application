<div class="container mt-5">
  <h2>Login</h2>
  <form #loginForm="ngForm" (ngSubmit)="onLogin(loginForm)">
    <div class="form-group">
      <label>Email</label>
      <input type="text" name="email" ngModel class="form-control" required>
    </div>
    <div class="form-group mt-2">
      <label>Password</label>
      <input type="password" name="password" ngModel class="form-control" required>
    </div>
    <button [disabled]="loginForm.invalid" type="submit" class="btn btn-primary mt-3">Login</button>
  </form>
</div>
