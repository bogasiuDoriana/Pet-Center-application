<div class="container mt-4">
  <h3>Pending Pet Adoptions</h3>

  <table class="table table-bordered table-striped" *ngIf="adoptions.length > 0">
    <thead class="thead-dark">
      <tr>
        <th>Owner</th>
        <th>Animal</th>
        <th>Species</th>
        <th>Date</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let a of adoptions">
        <td>{{ a.owner.name }} {{ a.owner.surname }}</td>
        <td>{{ a.animal.name }}</td>
        <td>{{ a.animal.specie }}</td>
        <td>{{ a.aplication_date | date }}</td>
        <td>
          <span class="badge badge-warning">{{ a.status }}</span>
        </td>
        <td>
          <button class="btn btn-success btn-sm mr-2"
                  (click)="approve(a.idpet_adoption)">
            Approve
          </button>

          <button class="btn btn-danger btn-sm"
                  (click)="reject(a.idpet_adoption)">
            Reject
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="adoptions.length === 0" class="alert alert-info">
    No pending adoptions.
  </div>
</div>
